ssl_private_dir: /etc/ssl/private/
ssl_certs_dir: /etc/ssl/certs/
tmp_cas_dir: /tmp/cas/

nginx_sites_available_path: /etc/nginx/sites-available/
nginx_sites_enabled_path: /etc/nginx/sites-enabled/
nginx_worker_connections: '1024'
nginx_user: www-data

ssl_ca_certs:
  - name: web.edge

ssl_fs_certs:
  - src: files/prometejs/prometejs.key
    dest: "{{ ssl_certs_dir }}"
    owner: "{{ nginx_user }}"
    mode: '0400'
  - src: files/prometejs/prometejs.pem
    dest: "{{ ssl_certs_dir }}"
    owner: "{{ nginx_user }}"

# revisit
nginx_sites:
  - name: prometejs
    src: files/prometejs/prometejs.conf
    enabled: True