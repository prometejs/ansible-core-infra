- name: Install NGINX
  package:
    name: nginx
    state: latest
    update_cache: yes

- name: Remove Default Site Configs
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/conf.d/

- name: Create Sites Directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ sites_enabled_path }}"
    - "{{ sites_available_path }}"

- name: Add Site Directory to Nginx Config
  lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '(\s+)?include\s+(\/etc\/nginx\/conf.d|\/etc\/nginx\/sites-enabled)'
    line: 'include {{ sites_enabled_path }}/*.conf;'
    state: present
    
- name: Start and enable NGINX
  service:
    name: nginx
    state: started
    enabled: yes
  ignore_errors: True