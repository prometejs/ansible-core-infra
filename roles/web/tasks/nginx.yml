- name: Install NGINX
  package:
    name: nginx
    state: latest
    update_cache: yes

- name: Remove Default Site Configs
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/conf.d/

- name: Create Sites Directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ sites_enabled_path }}"
    - "{{ sites_available_path }}"

- name: Deploy Nginx configuration
  template:
    src: templates/nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
 
- name: Start and enable NGINX
  service:
    name: nginx
    state: started
    enabled: yes
  ignore_errors: True