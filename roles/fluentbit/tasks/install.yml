- name: Installation Dependencies
  apt:
    name: "{{ packages }}"
    update_cache: true
    state: present
  vars:
    packages:
      - ca-certificates
      - apt-transport-https
      - curl
      - gnupg
      - lsb-release

- name: Add fluent-bit apt-key
  apt_key:
    url: "{{ gpg_key }}"
    state: present

- name: Add fluent-bit repository
  apt_repository:
    repo: "{{ apt_repo }}"
    state: present
    update_cache: true

- name: Install fluent-bit Package
  package:
    name: "{{ pkg }}={{ pkg_version }}"
    state: present
    update_cache: true

- name: Start fluent-bit Service
  service:
    name: "{{ service_name }}"
    state: started
    enabled: yes
    arguments: "-c {{ configuration_dir }}/fluent-bit.yml"