- name: Set SSL Facts [CAs]
  vars:
    ssl_key:
      src: "{{ ssl_private_dir | default('/etc/ssl/private/') }}/{{ item.name }}.pem"
      dest: "{{ tmp_cas_dir | default('/tmp/cas/') }}/{{ item.name }}.pem"
      tmp: "{{ tmp_cas_dir | default('/tmp/cas/') }}/{{ item.name }}.pem"
    ssl_cert:
      src: "{{ ssl_certs_dir | default('/etc/ssl/certs/') }}/{{ item.name }}.{{ item.ext | default('crt') }}"
      dest: "{{ tmp_cas_dir | default('/tmp/cas/') }}/{{ item.name }}.{{ item.ext | default('crt') }}"
      tmp: "{{ tmp_cas_dir | default('/tmp/cas/') }}/{{ item.name }}.{{ item.ext | default('crt') }}"
  set_fact:
    ssl_keys: "{{ (ssl_keys | default([])) + [ssl_key] }}"
    ssl_certs: "{{ (ssl_certs | default([])) + [ssl_cert] }}"
  loop: "{{ self_signed_certs }}"

- name: Import Self Signed Certs
  vars: &vars
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    tmp: "{{ item.tmp }}"
    src_host: "{{ groups['ca'][0] }}"
    owner: "{{ nginx_user }}"
  include_tasks: &include_tasks import.yml
  loop: "{{ ssl_certs }}"

- name: Import Sel Signed Keys
  vars: 
    <<: *vars
    mode: '0440'
  include_tasks: &include_tasks import.yml
  loop: "{{ ssl_keys }}"

