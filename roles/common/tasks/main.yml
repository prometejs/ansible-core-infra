- name: Update Cache
  include_tasks: cache.yml
  register: cache

- name: Configure Ansible User
  include_tasks: users.yml
  loop: "{{ users }}"
  loop_control:
    loop_var: user
  register: user

- name: Configure Firewall
  include_tasks: firewall.yml
  register: firewall

# # # # # # # # # # # #
# Reporting Configs ###
# # # # # # # # # ##### 

- name: Report Progress
  include_tasks: report.yml