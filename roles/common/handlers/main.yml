- name: send_email
  mail:
    host: "{{ mail_host }}"
    username: "{{ mail_username }}"
    password: "{{ mail_password }}"
    port: "{{ mail_port }}"
    subject: "[{{ ansible_hostname }}]: Ansible Report"
    body: |
      {{ report }}
    from: "{{ mail_sender }}"
    to: "{{ mail_receipients }}"
  delegate_to: localhost

- name: reload_ubuntu_firewall
  ufw:
    state: reloaded