- name: Generate Private Key [{{ item.name | upper }}]
  community.crypto.openssl_privatekey:
    path: "{{ ssl_private_dir }}/{{ item.name }}.pem"
    size: "{{ item.size | default('2048')}}"
    state: "{{ item.state | default('present') }}"
    type: "{{ item.type | default('RSA') }}"
    owner: "{{ item.owner | default(ansible_user) }}"

- name: Generate CSR [{{ item.name | upper }}]
  community.crypto.openssl_csr:
    path: "{{ ssl_csr_dir }}/{{ item.name }}.csr"
    privatekey_path: "{{ ssl_private_dir }}/{{ item.name }}.pem"
    common_name: "{{ item.csr.common_name | default(None) }}"
    state: "{{ item.state | default('present') }}"
    mode: "{{ item.mode | default('0644') }}"
    owner: "{{ item.owner | default(ansible_user) }}"
    country_name: "{{ item.csr.country_name | default(None) }}"
    email_address: "{{ item.csr.email_address | default(None) }}"
    group: "{{ item.group | default(ansible_user_primary_group) }}"
    organization_name: "{{ item.csr.organization_name | default(None) }}"
    organizational_unit_name: "{{ item.csr.organizational_unit_name | default(None) }}"
    state_or_province_name: "{{ item.csr.state_or_province_name | default(None) }}"
    subject: "{{ item.csr.subject | default({}) }}"
    subject_alt_name: "{{ item.csr.subject_alt_name | default([]) }}"
    locality_name: "{{ item.csr.locality_name | default(None) }}"
    basic_constraints: "{{ item.csr.basic_constraints | default(omit) }}"
    key_usage : "{{ item.csr.key_usage | default(omit) }}"
    extended_key_usage: "{{ item.csr.extended_key_usage | default(omit) }}"
    authority_key_identifier: "{{ item.csr.authority_key_identifier | default(omit) }}"
    subject_key_identifier : "{{ item.csr.subject_key_identifier | default(omit) }}"
    key_usage_critical: "{{ item.csr.key_usage_critical | default(omit) }}"
    basic_constraints_critical: "{{ item.csr.basic_constraints_critical | default(omit) }}"

- name: Generate Self Signed Certificate [{{ item.name | upper }}]
  community.crypto.x509_certificate: 
    selfsigned_not_after: "{{ item.expiry | default('+7300d') }}"
    selfsigned_digest: "{{ item.digest | default('sha256') }}"
    selfsigned_version: "{{ item.version | default('3')}}"
    provider: selfsigned
    <<: &certificate
      path: "{{ ssl_certs_dir }}/{{ item.name }}.{{ item.ext | default('crt') }}"
      privatekey_path: "{{ ssl_private_dir }}/{{ item.name }}.pem"
      csr_path: "{{ ssl_csr_dir }}/{{ item.name }}.csr"
      state: "{{ item.state | default('present') }}"
      mode: "{{ item.mode | default('644') }}"
      group: "{{ item.group | default(ansible_user_primary_group) }}"
      owner: "{{ item.owner | default(ansible_user) }}"
  when: item.name == item.cert.signer

- name: Generate CA Signed Certificate [{{ item.name | upper }}]
  community.crypto.x509_certificate:
    ownca_path: "{{ ssl_certs_dir }}/{{ item.cert.signer }}.{{ item.ext | default('crt') }}"
    ownca_privatekey_path: "{{ ssl_private_dir }}/{{ item.cert.signer }}.pem"
    ownca_digest: "{{ item.digest | default('sha256') }}"
    ownca_not_after: "{{ item.expiry | default('+7300d') }}"
    ownca_version: "{{ item.version | default('3')}}"
    provider: ownca
    <<: *certificate
  when: item.name != item.cert.signer

- name: Build CA self-signed certificate chain [{{ item.name | upper }}]
  include_tasks: chain.yml
  vars: 
    cert: "{{ item }}"
  when: item.chain | default(false) | bool