---
# Agent metadata
http_agent: stardust                                # code name to identify as, generally appears in web server logs

# Bitcoin user management
bitcoin_user: bitcoin
bitcoin_group: bitcoin

# Bitcoin binary information
bitcoin_version: 29.0
bitcoin_arch: x86_64-linux-gnu
pkg_ext: tar.gz                                     # options: zip, tar.gz (preferred)

# Bitcoin GPG configuration 
gpg_home_dir: /etc/apt/trusted.gpg.d                # location where GPG (GNU Privacy Guard) stores cryptographic keys
bitcoin_gpg_signer_pub_key:                       # public keys used to verify the downloaded SHA256SUMS file 
- fanquake

# Bitcoin node configuration
bitcoin_data_dir: /data/bitcoin
bitcoin_network: testnet
bitcoin_bind: 127.0.0.1
bitcoin_rpc_user: bitcoin                           # initial RPC server auth user
bitcoin_rpc_password: bitcoin                       # initial RPC server auth password
bitcoin_rpc_bind: 127.0.0.1                         # RPC server host
bitcoin_rpc_allow_ip: 127.0.0.1                     # RPC server whitelist host
bitcoin_zmq_host: 127.0.0.1                         # ZMQ TCP socket to receive raw block and transaction updates.
