---
- name: Bitcoind | Ensure dependencies are installed
  ansible.builtin.apt:
    update_cache: yes
    name: "{{ item }}"
    state: present
  loop:
    - gpg
    - dirmngr

- name: "Bitcoind | Download Bitcoin Core v{{ bitcoin_version }} into '/tmp/bitcoin-core-{{ bitcoin_version }}-{{ bitcoin_arch }}.{{ pkg_ext }}'"
  ansible.builtin.get_url:
    url: https://bitcoincore.org/bin/bitcoin-core-{{ bitcoin_version }}/bitcoin-{{ bitcoin_version }}-{{ bitcoin_arch }}.{{ pkg_ext }}
    dest: /tmp/bitcoin-core-{{ bitcoin_version }}-{{ bitcoin_arch }}.{{ pkg_ext }}
    checksum: sha256:https://bitcoincore.org/bin/bitcoin-core-{{ bitcoin_version }}/SHA256SUMS
    http_agent: '{{http_agent}}'

- name: "Bitcoind | Ensure '/usr/local/bitcoin-core-{{ bitcoin_version }}-{{ bitcoin_arch }}' directory exists"
  ansible.builtin.file:
    path: /usr/local/bitcoin-core-{{ bitcoin_version }}
    state: directory

- name: "Bitcoind | Unpack 'bitcoin-core-{{ bitcoin_version }}-{{ bitcoin_arch }}.{{ pkg_ext }}' into '/usr/local/bitcoin-core-{{ bitcoin_version }}'"
  ansible.builtin.unarchive:
    src: /tmp/bitcoin-core-{{ bitcoin_version }}-{{ bitcoin_arch }}.{{ pkg_ext }}
    dest: /usr/local/bitcoin-core-{{ bitcoin_version }}
    owner: "{{ bitcoin_user }}"
    group: "{{ bitcoin_group }}"
    remote_src: yes
    extra_opts:
      - --strip-components=1