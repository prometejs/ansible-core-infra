- name: Initialise CA
  tags: 
    - always
  include_tasks: prep.yml
  register: prep

- name: Configure CAs & Issue Certificates
  tags: 
    - control
  include_tasks: ca.yml
  register: cas
  loop: "{{ root_cas + intermediate_cas + entity_cas }}" # Ordered list based on dependency

- name: Copy CAs From Control Node to Workstation Node
  tags: 
    - control
  fetch:
    src: "{{ ssl_certs_dir }}/{{ item.name }}.crt"
    dest: "/tmp/cas/{{ item.name }}.crt"
    flat: true
  register: load
  loop: "{{ root_cas }}"

- name: Add Root CAs To Trusted CAs For All Nodes
  tags: 
    - always
  include_tasks: trust.yml
  register: trust
  loop: "{{ root_cas }}"

# Run last
- name: Create Report Registry
  tags: 
    - always
  include_role:
    name: common
    tasks_from: registry
  vars:
    role_registry: 
      - "{{ prep }}"
      - "{{ cas }}"
      - "{{ load }}"
      - "{{ trust }}"