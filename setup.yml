# # # # # # # # #  
# Init Scripts ## 
# # # # # # # ### 

- hosts: 
    - workstation
  tasks:
    - name: Install Required Packages
      package:
        name: "{{ item }}"
        state: latest
      loop: 
        - sshpass
        - python3-pip

    - name: Install Ansible Dependencies
      local_action: ansible.builtin.shell ansible-galaxy install -r requirements.yml

    - name: Install Ansible Roles Python Dependencies
      ansible.builtin.pip:
        requirements: dependencies.python

    - name: Register All Hosts Fingerprint As Trusted Known Hosts
      local_action: ansible.builtin.shell ./setup.sh {{ host }}
      loop: "{{ groups['all'] }}"
      loop_control:
        loop_var: host