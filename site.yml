# # # # # # # # # 
# Site Configs ##
# # # # # # # ### 

- hosts: all
  become: true
  roles:
    - common

- hosts: web_server
  become: true
  roles:
    - web

- hosts: control_node
  become: true
  tags: 
    - control
  roles:
    - ca

- hosts: worker_node
  become: true
  tags: 
    - worker
  roles:
    - ca

# Run last
- hosts: all
  name: Report
  tasks:
    - name: Create & Email Report
      include_role:
        name: common
        tasks_from: report
      vars:
        registry: "{{hostvars[inventory_hostname]['registry']}}"
      when: hostvars[inventory_hostname]['registry'] is defined