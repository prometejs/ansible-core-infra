name: deploy configurations

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select environment
        required: false
        default: '*'
        options:
          - '*'
          - dev
          - prod
          - staging
      server-type:
        description: 'Select specific server'
        required: false
        default: '*'
        type: choice
        options:
          - '*'
          - web_servers
          - master_site
          - worker_sites
    branches:
      - main

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible & Add Community Collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.general

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run Host Setups
        run: |
          set -e
          echo "Environment: ${{ inputs.environment }}"
          for playbook in ./playbooks/setups/*.yaml; do
            if [ -f "$playbook" ]; then  
              echo "Running $playbook with verbosity level 3"
              ansible-playbook $playbook -vvv \
              --private-key ~/.ssh/id_rsa \
              --connection-password-file files/secrets/CONNECTION_PASSWORD_FILE.key \
              --become-password-file files/secrets/BECOME_PASSWORD_FILE.key \
              '${{ inputs.environment }}:${{ inputs.server-type }}'
            else
              echo "Skipping $playbook, not a file."
            fi
          done

      - name: Run Host Configurations
        run: |
          set -e
          echo "Environment: ${{ inputs.environment }}"
          for playbook in ./playbooks/configs/*.yaml; do
            if [ -f "$playbook" ]; then
              echo "Running $playbook with verbosity level 3"
              ansible-playbook $playbook -vvv \
              --private-key ~/.ssh/id_rsa \
              --connection-password-file files/secrets/CONNECTION_PASSWORD_FILE.key \
              --become-password-file files/secrets/BECOME_PASSWORD_FILE.key \
              '${{ inputs.environment }}:${{ inputs.server-type }}'
            else
              echo "Skipping $playbook, not a file."
            fi
          done
