name: deploy configurations

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select environment
        required: false
        default: '*'
        options:
          - '*'
          - dev
          - prod
          - staging
      server-type:
        description: 'Select specific server'
        required: false
        default: '*'
        type: choice
        options:
          - '*'
          - web_server
          - master_site
          - worker_sites
    branches:
      - main

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Remove host_vars files
        run: |
          echo "Removing host_vars as it takes precedence over ansible.cfg because user for this file is set in ansible.cfg"
          rm -rf host_vars/

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible & Add Community Collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.general

      - name: Configure Runner SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible
          chmod 600 ~/.ssh/ansible

      - name: Configure Runner Vault Key
        run: |
          echo "${{ secrets.VAULT_KEY }}" > ~/.vault-key.txt
          chmod 600 ~/.vault-key.txt

      - name: Configure Runner Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/github-deploy-key
          # chmod 600 ~/.ssh/github-deploy-key

      - name: Run Host Setups
        run: |
          set -e
          echo "Environment: ${{ inputs.environment }}"
          for playbook in ./playbooks/setups/*.yaml ./playbooks/configs/*.yml; do
            if [ -f "$playbook" ]; then  
              echo "Running $playbook with verbosity level 3"
              ansible-playbook $playbook -vvv \
              --private-key ~/.ssh/ansible \
              --limit '${{ inputs.environment }}:${{ inputs.server-type }}'
            else
              echo "Skipping $playbook, not a file."
            fi
          done

      - name: Run Host Configurations
        run: |
          set -e
          echo "Environment: ${{ inputs.environment }}"
          for playbook in ./playbooks/configs/*.yaml ./playbooks/configs/*.yml; do
            if [ -f "$playbook" ]; then
              echo "Running $playbook with verbosity level 3"
              ansible-playbook $playbook -vvv \
              --private-key ~/.ssh/ansible \
              --limit '${{ inputs.environment }}:${{ inputs.server-type }}'
            else
              echo "Skipping $playbook, not a file."
            fi
          done
