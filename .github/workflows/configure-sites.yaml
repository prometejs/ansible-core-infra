name: bootstrap sites

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select environment
        required: false
        default: '*'
        options:
          - '*'
          - dev
          - prod
          - staging
      server-type:
        description: 'Select specific server'
        required: false
        default: '*'
        type: choice
        options:
          - '*'
          - web_servers
          - master_site
          - worker_sites
    branches:
      - main

jobs:
  bootstrap-sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ansible & Add Community Collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.general

      - name: Configure Runner Vault Key
        run: |
          echo "${{ secrets.VAULT_KEY }}" > ~/.vault-key.txt
          chmod 600 ~/.vault-key.txt

      - name: Bootstrap Servers
        run: |
          set -e
          echo "Environment: ${{ inputs.environment }}"
          echo "Servers: ${{ inputs.server-type }}"
          ansible-playbook playbooks/sites/bootstrap.yaml -vvv --limit '${{ inputs.environment }}:${{ inputs.server-type }}'

      - name: Add Users
        run: |
          set -e
          echo "Environment: ${{ inputs.environment }}"
          echo "Servers: ${{ inputs.server-type }}"
          for playbook in ./playbooks/sites/users/*.yaml ./playbooks/sites/users/*.yml; do
            if [ -f "$playbook" ]; then  
              echo "Running $playbook with verbosity level 3"
              ansible-playbook $playbook -vvv \
              --limit '${{ inputs.environment }}:${{ inputs.server-type }}'
            else
              echo "Skipping $playbook, not a file."
            fi
          done