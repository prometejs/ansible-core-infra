name: deploy configs to development

on:
  workflow_dispatch:
    branches:
      - main

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.1x

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run Host Configurations
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          set -e
          for playbook in ./playbooks/*.yaml; do
            if [ -f "$playbook" ]; then
              echo "Running playbook $playbook with verbosity level 3"
              ansible-playbook -i development $playbook -vvv
            else
              echo "Skipping $playbook, not a file."
            fi
          done
