name: 'Install Dependencies'
description: 'Composite Action For Install Ansible Dependencies'
inputs:
  test:
    description: 'Flag To Install Test Dependencies'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Configure Runner Vault Key
      shell: bash
      run: |
        echo "${{ secrets.VAULT_KEY }}" > ~/.vault-key.key
        chmod 600 ~/.vault-key.key

    - name: Install Ansible
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository --yes --update ppa:ansible/ansible
        sudo apt-get install -y ansible
        ansible-galaxy collection install community.crypto

    - name: Install Ansible
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository --yes --update ppa:ansible/ansible
        sudo apt-get install -y ansible
        ansible-galaxy collection install community.crypto

    - name: Install Test Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install molecule
      if: ${{ inputs.test }} == 'true'